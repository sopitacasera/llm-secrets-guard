name: LLM Secrets Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, develop]

jobs:
  scan:
    name: Scan for leaked LLM API keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install llm-secrets-guard
        run: pip install .

      - name: Run scan
        run: |
          llm-secrets-guard . \
            --fail-on-findings \
            --json \
            --output scan-report.json \
            --no-banner

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-secrets-scan-report
          path: scan-report.json
          retention-days: 30
